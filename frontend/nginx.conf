server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;

    # Docker 内嵌 DNS。配合下面的变量式 proxy_pass 使用：proxy_pass 里一旦
    # 出现变量，nginx 就不会在启动时把 api 解析成 IP 缓存下来，而是每次请求
    # 按 resolver 的 TTL 重新解析。
    #
    # 之前写成 proxy_pass http://api:8080（无变量），nginx 启动时就把 api 解析
    # 成固定 IP 并缓存；API 容器一重启（compose restart / 重建）就换 IP，
    # 前端立刻变成 502，表现为"素材库加载失败"。改成变量式后换 IP 无感。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    set $api_backend http://api:8080;

    # 后端 API。保持 /api 前缀原样转发到 FastAPI。
    # 浏览器发来的 Origin 会被后端当作跨域来源拒绝，这里清空该头，
    # 让后端按服务端同源请求处理（与 vite.config.ts 的 stripOrigin 一致）。
    location /api/ {
        # 注意：变量值里不带 URI 部分，nginx 才会原样透传请求路径。
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 任务产物（视频 / 音频 / 字幕）由 API 以 /tasks/... 返回，支持 Range 请求。
    location /tasks/ {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 健康检查。变量值里带 URI 部分，这里才会把请求路径改写成 /ping。
    location = /ping {
        proxy_pass $api_backend/ping;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
    }

    # SPA 路由回退。
    location / {
        try_files $uri $uri/ /index.html;
    }
}